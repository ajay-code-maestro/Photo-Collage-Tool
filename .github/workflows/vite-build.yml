name: Vite Build

on:
  push:
    branches:
      - main
      - ai-layout-remove
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vite Application
        working-directory: frontend
        run: npm run build
